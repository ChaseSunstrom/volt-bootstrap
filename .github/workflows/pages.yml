# Builds the site with its generator (site/gen, in Volt, compiled by the bootstrap compiler with the C
# backend) and publishes it to GitHub Pages on every push to main.
# In the repository's settings, Pages' source has to be "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "std/**", "bootstrap/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --bin voltc-bootstrap
      - run: ./target/release/voltc-bootstrap run site/gen/*.volt --std std -- site site/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
