# Builds and tests Volt on every push to main and every pull request. A job that fails fails the run:
# nothing here is allowed to fail quietly.
#
# Linux and macOS (x86-64 and arm64) run the whole suite: both compilers, std, bolt, the language
# server, the docs and site, and interop; Linux bare metal under qemu too. voltc, the self-hosted
# compiler, doesn't run on Windows yet, so Windows (x86-64 and arm64) runs what goes through the
# bootstrap compiler: bolt's and its unit tests, programs through the C backend, and the site
# generator building every page.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# the jobs only read the code
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  LLVM_VERSION: 23

jobs:
  linux:
    name: test (linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      # LLVM and libclang for voltc's LLVM backend and C imports; clang, llvm-nm and ld.lld for the
      # cross-compile and bare-metal tests; qemu runs the bare-metal boards; g++ 14 for the C++
      # imports' wrappers (the runner's g++ 13 has no C++23 explicit object parameters)
      - name: Install LLVM, qemu and test tools
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION" all
          sudo apt-get install -y qemu-system-arm qemu-system-misc g++-14
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
          echo "LLVM_CONFIG=/usr/lib/llvm-$LLVM_VERSION/bin/llvm-config" >> "$GITHUB_ENV"
          # voltc's own sources import LLVM's C headers, which apt.llvm.org keeps beside its libraries
          # (for C only: C++ would take LLVM's libc++ headers over libstdc++'s)
          echo "C_INCLUDE_PATH=/usr/lib/llvm-$LLVM_VERSION/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=/usr/lib/llvm-$LLVM_VERSION/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-$LLVM_VERSION/lib" >> "$GITHUB_ENV"
      # Node's types for the TypeScript checks (tsc comes with the runner): the clients import
      # node:module, and tsc finds @types in the node_modules of any folder above them
      - name: Install Node's types
        run: npm install --no-save --no-package-lock --no-audit --no-fund @types/node
      - name: Build (no warnings)
        run: |
          cargo build 2>&1 | tee build.log
          ! grep -q '^warning' build.log
      - name: Test
        run: |
          set -o pipefail
          cargo test --no-fail-fast 2>&1 | tee test.log
      # what failed, as annotations on the run's summary page
      - name: Report failures
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          tests=$(grep -E '^test .* \.\.\. FAILED$' test.log | sed 's/^test //; s/ \.\.\. FAILED$//' | head -40 | paste -sd ' ')
          [ -n "$tests" ] && echo "::error title=failed tests::$tests"
          golden=$(grep -E '^/.*\.volt: (exit|want errors)' test.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$golden" ] && echo "::error title=failed programs::$golden"
          grep -n 'panicked at' test.log | head -7 | while IFS=: read -r n _; do
            ctx=$(sed -n "${n},$((n + 12))p" test.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=panic::$ctx"
          done
          exit 0

  editor:
    name: editor (grammar and extension)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test

  macos:
    name: test (macos ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, os: macos-latest }
          - { arch: x86-64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      # Homebrew's llvm (keg-only: off PATH, so cc stays Apple's clang): LLVM and libclang for voltc
      - name: Install LLVM
        run: |
          brew install llvm
          prefix=$(brew --prefix llvm)
          version=$("$prefix/bin/llvm-config" --version)
          [ "${version%%.*}" = "$LLVM_VERSION" ] || { echo "::error::Homebrew's llvm is $version, not LLVM $LLVM_VERSION"; exit 1; }
          echo "LLVM_CONFIG=$prefix/bin/llvm-config" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=$prefix/include" >> "$GITHUB_ENV"
      - name: Install Node's types
        run: npm install --no-save --no-package-lock --no-audit --no-fund @types/node
      - name: Build (no warnings)
        run: |
          cargo build 2>&1 | tee build.log
          ! grep -q '^warning' build.log
      - name: Test
        run: |
          set -o pipefail
          cargo test --no-fail-fast 2>&1 | tee test.log
      - name: Report failures
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          tests=$(grep -E '^test .* \.\.\. FAILED$' test.log | sed 's/^test //; s/ \.\.\. FAILED$//' | head -40 | paste -sd ' ' -)
          [ -n "$tests" ] && echo "::error title=failed tests::$tests"
          exit 0

  windows:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows x86-64, os: windows-latest }
          - { name: windows arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Build the compilers
        run: cargo build --release --bins
      - name: Build and run programs (C backend)
        run: |
          for f in tests/run/operators.volt tests/run/struct_update.volt tests/run/match_slices.volt; do
            echo "== $f"
            ./target/release/voltc-bootstrap run "$f"
          done
      # what doesn't need voltc: bolt's and the bootstrap compiler's unit tests, every source file's
      # header, the site generator (built by the bootstrap compiler) making every page, and the docs
      # and runtime checks that read files
      - name: Test
        run: |
          cargo test --bins
          cargo test --test headers --test site
          cargo test --test docs -- readme_links shown_schema_is_the_sample builtins_page_is_complete
          cargo test --test selfhost -- runtime_text_in_sync runtime_compiles_for_every_target
