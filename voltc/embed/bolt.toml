[package]
name = "voltvm"
version = "0.1.0"
description = "Volt embedded in other programs: compile Volt source in memory and run it through LLVM's JIT"

# the compiler's own sources, as a library whose interface is volt_vm (src/vm.volt)
[lib]
path = "../src"
kind = ["shared"]
bindings = ["c", "cpp", "rust", "python", "pyi"]

[std]
path = "../../std"

# a script's JIT links against the runtime this library exports, which the LLVM backend's runtime
# unit does and the C backend's (static) doesn't: Windows builds with C by default
[profile.dev]
backend = "llvm"

[profile.release]
backend = "llvm"

[build]
files = ["build.volt"]
